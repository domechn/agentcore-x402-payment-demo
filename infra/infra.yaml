AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles for the minimal AgentCore Payments x402 demo

Resources:
  # Assumed by the AgentCore Payments service to read your Privy credentials from AgentCore Identity.
  PaymentsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:payment-manager/*' }
      Policies:
        - PolicyName: payments-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:DeleteWorkloadIdentity
                  - bedrock-agentcore:GetWorkloadAccessToken
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*'
              - Effect: Allow
                Action: bedrock-agentcore:GetResourcePaymentToken
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/*'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreatePaymentCredentialProvider
                  - bedrock-agentcore:GetPaymentCredentialProvider
                  - bedrock-agentcore:TagResource
                Resource: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/*'
              # ponytail: scoped by AgentCore Identity's secret-name prefix; setup_payments.py prints the real
              # secret ARNs — narrow this to those exact ARNs for production.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!*'

  # The agent's identity, assumed from your laptop via an AWS profile.
  # It can spend within a session but can NOT create sessions/wallets, so it can't raise its own budget.
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:ProcessPayment
                  - bedrock-agentcore:GetPaymentInstrument
                  - bedrock-agentcore:ListPaymentInstruments
                  - bedrock-agentcore:GetPaymentInstrumentBalance
                  - bedrock-agentcore:GetPaymentSession
                Resource: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:payment-manager/*'

Outputs:
  PaymentsServiceRoleArn:
    Value: !GetAtt PaymentsServiceRole.Arn
  AgentRoleArn:
    Value: !GetAtt AgentRole.Arn
